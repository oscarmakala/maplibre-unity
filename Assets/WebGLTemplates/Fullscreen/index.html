<!DOCTYPE html>
<html lang="en-us">
<!--
  Custom WebGL template that pins the Unity canvas to the full browser
  viewport. Replaces the bundled "Default" template (Unity logo, footer,
  fixed 960x600 canvas). Tracked under Assets/WebGLTemplates/Fullscreen/
  per Unity's required path; selected via Player Settings -> WebGL ->
  Resolution and Presentation -> WebGL Template = "Fullscreen", which
  the .asset file records as `webGLTemplate: PROJECT:Fullscreen`.

  Loader behaviour matches Unity's Minimal template -- no progress UI,
  no fullscreen button, just attach the canvas and start the runtime.
  Pointer / keyboard focus is forwarded to the canvas via tabindex so
  WASD and similar input reaches the player without requiring a click.
-->
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #unity-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            outline: none;
        }
        /* Loading overlay shown until Unity finishes booting -- Unity's
           runtime doesn't paint anything until the first scene is up, so
           a black canvas would otherwise look frozen for several seconds. */
        #unity-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        #unity-loading.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading">Loading {{{ PRODUCT_NAME }}}...</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
        // Honour the device pixel ratio so retina / 4K displays render
        // at native resolution. Cap at 2 to avoid wasting GPU on
        // ultra-high-density screens; the difference past 2x is rarely
        // visible and the cost (texture memory) is real.
        var devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        var canvas = document.querySelector("#unity-canvas");
        var loadingEl = document.querySelector("#unity-loading");

        createUnityInstance(canvas, {
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
            devicePixelRatio: devicePixelRatio,
            matchWebGLToCanvasSize: true,
        }).then(function () {
            loadingEl.classList.add("hidden");
            setTimeout(function () { loadingEl.remove(); }, 400);
        }).catch(function (message) {
            loadingEl.textContent = "Failed to load: " + message;
        });
    </script>
</body>
</html>
